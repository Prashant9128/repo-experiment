<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-black">
    <p>This is a Login/Singup Page</p>
    <div class="backdrop-blur-lg p-8 rounded-lg w-96 bg-white">
        <form>
            <div class="mb-4">
                <label class="block text-black">Username</label>
                <input type="text" name="phone" class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-black placeholder-gray-400" placeholder="Enter your username" required>
            </div>
            <div class="mb-4">
                <label class="block text-black">Email Address</label>
                <input type="text" name="phone" class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-black placeholder-gray-400" placeholder="Enter your Email" required>
            </div>
            <div class="mb-4">
                <label class="block text-black">Phone number:</label>
                <div class="flex">
                    <select name="country_code" class="px-3 py-2 border rounded-l-lg bg-gray-100 text-black w-1/3">
                        <option value="+1" selected>+1</option>
                        <option value="+44">+44</option>
                        <option value="+91">+91</option>
                        <option value="+92">+92</option>
                        <option value="+880">+880</option>
                        <option value="+61">+61</option>
                        <option value="+971">+971</option>
                    </select>
                    <input type="text" name="phone" class="w-full px-4 py-2 border rounded-r-lg bg-gray-100 text-black placeholder-gray-400" placeholder="1234567890" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-black">Your password:</label>
                <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-black placeholder-gray-400" required>
            </div>
            <div class="mb-4 flex items-center">
                <input type="checkbox" id="terms" name="terms" class="mr-2">
                <label for="terms" class="text-black">I accept the <a href="#" class="text-blue-500 underline">Terms and Conditions</a></label>
            </div>
            <div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">Sign up</button>
            </div>
        </form>
    </div> 
</body>
</html>
